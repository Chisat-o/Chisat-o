<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" font-family="monospace">
  <defs>
    <clipPath id="globe">
      <circle cx="180" cy="180" r="110"/>
    </clipPath>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff006e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="55%">
      <stop offset="80%" stop-color="#ff006e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g stroke="#ff006e" stroke-width="2" fill="none" filter="url(#glow)">
    <polyline points="14,46 14,14 46,14"/>
    <polyline points="314,14 346,14 346,46"/>
    <polyline points="346,314 346,346 314,346"/>
    <polyline points="46,346 14,346 14,314"/>
  </g>

  <g font-size="9" fill="#ff006e" filter="url(#glow)">
    <text x="22" y="32">[ TRACKING ]</text>
    <text x="22" y="46">LAT: 51.5074°N</text>
    <text x="22" y="58">LON: 13.4050°E</text>
    <text x="248" y="32" text-anchor="start">SIG -47dBm</text>
    <text x="248" y="46">PING 14ms</text>
    <text x="248" y="58">NODES: 0247</text>
    <text x="22" y="332">&gt; SCANNING</text>
    <text x="22" y="344">&gt; UPLINK OK</text>
    <text x="248" y="332">[ ACTIVE ]</text>
    <text x="248" y="344">SYS v0.4.2</text>
  </g>

  <g transform="translate(180,180)">
    <circle r="125" fill="url(#atmo)"/>
    <circle r="110" fill="#0d0014"/>

    <g clip-path="url(#globe)" transform="translate(180,180)">
      <g stroke="#ff006e" stroke-width="0.5" fill="none" opacity="0.4" transform="translate(-180,-180)">
        <line x1="-180" y1="0" x2="180" y2="0"/>
        <ellipse rx="110" ry="20"/>
        <ellipse rx="110" ry="40"/>
        <ellipse rx="110" ry="60"/>
        <ellipse rx="110" ry="80"/>
        <ellipse rx="110" ry="100"/>
      </g>
    </g>

    <g clip-path="url(#globe)" transform="translate(180,180)">
      <g stroke="#ff4d8d" stroke-width="0.6" fill="none" opacity="0.55" transform="translate(-180,-180)">
        <ellipse rx="110" ry="110"/>
        <ellipse rx="92" ry="110"/>
        <ellipse rx="72" ry="110"/>
        <ellipse rx="50" ry="110"/>
        <ellipse rx="26" ry="110"/>
        <line x1="0" y1="-110" x2="0" y2="110"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>

    <g clip-path="url(#globe)" transform="translate(180,180)">
      <g transform="translate(-180,-180)">
        <path d="M 0 0 L 110 0 A 110 110 0 0 1 -55 95 Z" fill="url(#sweep)" opacity="0.35">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <g stroke="#ff006e" stroke-width="1.5" filter="url(#glow)">
      <line x1="-128" y1="0" x2="-114" y2="0"/>
      <line x1="114" y1="0" x2="128" y2="0"/>
      <line x1="0" y1="-128" x2="0" y2="-114"/>
      <line x1="0" y1="114" x2="0" y2="128"/>
    </g>

    <g stroke="#ff006e" stroke-width="0.5" fill="none" opacity="0.4">
      <line x1="-70" y1="-50" x2="40" y2="20"/>
      <line x1="40" y1="20" x2="-30" y2="60"/>
      <line x1="-30" y1="60" x2="60" y2="-40"/>
      <line x1="60" y1="-40" x2="-70" y2="-50"/>
      <line x1="-30" y1="60" x2="-70" y2="-50"/>
    </g>

    <g filter="url(#glow)">
      <g>
        <circle cx="-70" cy="-50" r="3" fill="#ff006e"/>
        <circle cx="-70" cy="-50" r="6" fill="none" stroke="#ff006e" stroke-width="0.8">
          <animate attributeName="r" values="3;14;3" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <circle cx="40" cy="20" r="3" fill="#ff006e"/>
        <circle cx="40" cy="20" r="6" fill="none" stroke="#ff006e" stroke-width="0.8">
          <animate attributeName="r" values="3;14;3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <circle cx="-30" cy="60" r="3" fill="#ff006e"/>
        <circle cx="-30" cy="60" r="6" fill="none" stroke="#ff006e" stroke-width="0.8">
          <animate attributeName="r" values="3;14;3" dur="2s" begin="1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="2s" begin="1s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <circle cx="60" cy="-40" r="3" fill="#ff006e"/>
        <circle cx="60" cy="-40" r="6" fill="none" stroke="#ff006e" stroke-width="0.8">
          <animate attributeName="r" values="3;14;3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0;1" dur="2s" begin="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <circle r="110" fill="none" stroke="#ff006e" stroke-width="1.5" filter="url(#glow)"/>
  </g>

  <g opacity="0.15">
    <rect x="0" y="0" width="360" height="2" fill="#ff006e">
      <animate attributeName="y" values="0;360;0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
