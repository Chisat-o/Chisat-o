<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="atmo" cx="50%" cy="50%" r="55%">
      <stop offset="55%" stop-color="#ff006e" stop-opacity="0"/>
      <stop offset="80%" stop-color="#ff006e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0030" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d0014" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <circle cx="180" cy="180" r="170" fill="url(#atmo)"/>

  <g transform="translate(180,180)">
    <circle r="120" fill="url(#core)"/>

    <g stroke="#ff006e" fill="none" stroke-width="0.6" opacity="0.55" filter="url(#glow)">
      <ellipse rx="120" ry="18"/>
      <ellipse rx="120" ry="40"/>
      <ellipse rx="120" ry="62"/>
      <ellipse rx="120" ry="84"/>
      <ellipse rx="120" ry="105"/>
    </g>

    <line x1="-120" y1="0" x2="120" y2="0" stroke="#ff006e" stroke-width="0.9" opacity="0.85" filter="url(#glow)"/>

    <g stroke="#ffb3d9" fill="none" stroke-width="0.8" opacity="0.9" filter="url(#glow)">
      <ellipse ry="120">
        <animate attributeName="rx" values="120;0;120" dur="8s" begin="0s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse ry="120">
        <animate attributeName="rx" values="120;0;120" dur="8s" begin="-1s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse ry="120">
        <animate attributeName="rx" values="120;0;120" dur="8s" begin="-2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse ry="120">
        <animate attributeName="rx" values="120;0;120" dur="8s" begin="-3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse ry="120">
        <animate attributeName="rx" values="120;0;120" dur="8s" begin="-4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse ry="120">
        <animate attributeName="rx" values="120;0;120" dur="8s" begin="-5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse ry="120">
        <animate attributeName="rx" values="120;0;120" dur="8s" begin="-6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse ry="120">
        <animate attributeName="rx" values="120;0;120" dur="8s" begin="-7s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <line x1="0" y1="-120" x2="0" y2="120" stroke="#ff006e" stroke-width="0.5" opacity="0.4"/>

    <circle r="120" fill="none" stroke="#ff006e" stroke-width="1.6" filter="url(#glow)"/>

    <circle r="120" fill="none" stroke="#ff006e" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="120;145;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle r="3" cx="-50" cy="-30" fill="#ffe0ec" filter="url(#bigGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" cx="40" cy="20" fill="#ffe0ec" filter="url(#bigGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" cx="-20" cy="55" fill="#ffe0ec" filter="url(#bigGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
