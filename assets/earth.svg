<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" font-family="monospace">
  <defs>
    <clipPath id="scope">
      <circle cx="180" cy="180" r="135"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <radialGradient id="atmo" cx="50%" cy="50%" r="55%">
      <stop offset="60%" stop-color="#ff006e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0030" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d0014" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff006e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="180" cy="180" r="160" fill="url(#atmo)"/>
  <circle cx="180" cy="180" r="135" fill="url(#core)"/>

  <g transform="translate(180,180)" stroke="#ff006e" fill="none" filter="url(#glow)">
    <circle r="34" stroke-width="0.5" opacity="0.45"/>
    <circle r="68" stroke-width="0.5" opacity="0.45"/>
    <circle r="101" stroke-width="0.5" opacity="0.5"/>
    <circle r="135" stroke-width="1.4" opacity="0.95"/>
  </g>

  <g transform="translate(180,180)" stroke="#ff006e" stroke-width="0.5" opacity="0.4">
    <line x1="-135" y1="0" x2="135" y2="0"/>
    <line x1="0" y1="-135" x2="0" y2="135"/>
    <line x1="-95" y1="-95" x2="95" y2="95"/>
    <line x1="-95" y1="95" x2="95" y2="-95"/>
  </g>

  <g transform="translate(180,180)" stroke="#ff006e" stroke-width="1" opacity="0.7">
    <line x1="135" y1="0" x2="143" y2="0"/>
    <line x1="-135" y1="0" x2="-143" y2="0"/>
    <line x1="0" y1="135" x2="0" y2="143"/>
    <line x1="0" y1="-135" x2="0" y2="-143"/>
  </g>

  <g font-size="10" fill="#ff006e" filter="url(#glow)" font-weight="bold">
    <text x="180" y="40" text-anchor="middle">N</text>
    <text x="180" y="335" text-anchor="middle">S</text>
    <text x="335" y="184" text-anchor="middle">E</text>
    <text x="25" y="184" text-anchor="middle">W</text>
  </g>

  <g font-size="8" fill="#ff006e" opacity="0.85">
    <text x="22" y="32">[ RADAR ]</text>
    <text x="22" y="46">SCAN: ACTIVE</text>
    <text x="270" y="32">RNG: 135km</text>
    <text x="270" y="46">FREQ: 2.4GHz</text>
    <text x="22" y="332">CONTACTS</text>
    <text x="22" y="346">&gt; 0006</text>
    <text x="270" y="332">SWEEP 4.0s</text>
    <text x="270" y="346">SYS OK</text>
  </g>

  <g clip-path="url(#scope)">
    <g transform="translate(180,180)">
      <path d="M 0 0 L 135 0 A 135 135 0 0 1 95.5 95.5 Z" fill="url(#sweep)" opacity="0.45">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </path>
      <line x1="0" y1="0" x2="135" y2="0" stroke="#ff006e" stroke-width="1.5" opacity="0.95" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <g transform="translate(180,180)" filter="url(#bigGlow)">
    <g>
      <circle cx="-55" cy="-30" r="3" fill="#ffe0ec">
        <animate attributeName="opacity" values="0;0;1;0.6;0.3;0" keyTimes="0;0.05;0.1;0.4;0.7;1" dur="4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-55" cy="-30" r="3" fill="none" stroke="#ff006e" stroke-width="0.8">
        <animate attributeName="r" values="3;14" dur="1.2s" begin="0.55s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.2s" begin="0.55s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="42" cy="18" r="2.5" fill="#ffe0ec">
        <animate attributeName="opacity" values="0;0;1;0.5;0.2;0" keyTimes="0;0.4;0.45;0.7;0.9;1" dur="4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="42" cy="18" r="2.5" fill="none" stroke="#ff006e" stroke-width="0.8">
        <animate attributeName="r" values="2.5;12" dur="1.2s" begin="2.05s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.2s" begin="2.05s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="-25" cy="60" r="2.2" fill="#ffe0ec">
        <animate attributeName="opacity" values="0;0;1;0.4;0;0" keyTimes="0;0.65;0.7;0.85;0.95;1" dur="4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-25" cy="60" r="2.2" fill="none" stroke="#ff006e" stroke-width="0.7">
        <animate attributeName="r" values="2.2;10" dur="1.2s" begin="2.95s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.2s" begin="2.95s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="80" cy="-65" r="2.5" fill="#ffe0ec">
        <animate attributeName="opacity" values="0;0;1;0.4;0" keyTimes="0;0.18;0.22;0.55;0.85" dur="4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="-65" r="2.5" fill="none" stroke="#ff006e" stroke-width="0.8">
        <animate attributeName="r" values="2.5;13" dur="1.2s" begin="0.95s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.2s" begin="0.95s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="-95" cy="40" r="2.2" fill="#ffe0ec">
        <animate attributeName="opacity" values="0;0;1;0.5;0;0" keyTimes="0;0.55;0.6;0.78;0.95;1" dur="4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-95" cy="40" r="2.2" fill="none" stroke="#ff006e" stroke-width="0.7">
        <animate attributeName="r" values="2.2;11" dur="1.2s" begin="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.2s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="55" cy="90" r="2" fill="#ffe0ec">
        <animate attributeName="opacity" values="0;0;1;0.3;0" keyTimes="0;0.85;0.9;0.97;1" dur="4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="55" cy="90" r="2" fill="none" stroke="#ff006e" stroke-width="0.7">
        <animate attributeName="r" values="2;9" dur="1.2s" begin="3.65s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.2s" begin="3.65s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <circle cx="180" cy="180" r="2.5" fill="#ff006e" filter="url(#glow)"/>
</svg>
