<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <clipPath id="globe">
      <circle cx="180" cy="180" r="120"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="atmo" cx="50%" cy="50%" r="55%">
      <stop offset="55%" stop-color="#ff006e" stop-opacity="0"/>
      <stop offset="80%" stop-color="#ff006e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0030" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d0014" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <circle cx="180" cy="180" r="170" fill="url(#atmo)"/>
  <circle cx="180" cy="180" r="120" fill="url(#core)"/>

  <g clip-path="url(#globe)">
    <g>
      <g fill="#ff006e" opacity="0.7" filter="url(#glow)">
        <circle cx="80" cy="120" r="3"/>
        <circle cx="120" cy="155" r="4"/>
        <circle cx="100" cy="210" r="3"/>
        <circle cx="160" cy="180" r="2.5"/>
        <circle cx="200" cy="135" r="3.5"/>
        <circle cx="240" cy="225" r="3"/>
        <circle cx="220" cy="160" r="2"/>
        <circle cx="180" cy="245" r="3"/>
        <circle cx="60" cy="180" r="2.5"/>
        <ellipse cx="140" cy="160" rx="22" ry="10"/>
        <ellipse cx="220" cy="200" rx="16" ry="8"/>
        <ellipse cx="100" cy="190" rx="14" ry="6"/>

        <circle cx="320" cy="120" r="3"/>
        <circle cx="360" cy="155" r="4"/>
        <circle cx="340" cy="210" r="3"/>
        <circle cx="400" cy="180" r="2.5"/>
        <circle cx="440" cy="135" r="3.5"/>
        <circle cx="480" cy="225" r="3"/>
        <circle cx="460" cy="160" r="2"/>
        <circle cx="420" cy="245" r="3"/>
        <circle cx="300" cy="180" r="2.5"/>
        <ellipse cx="380" cy="160" rx="22" ry="10"/>
        <ellipse cx="460" cy="200" rx="16" ry="8"/>
        <ellipse cx="340" cy="190" rx="14" ry="6"/>
      </g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -240,0" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <g stroke="#ff006e" fill="none" stroke-width="0.6" opacity="0.55" filter="url(#glow)">
    <ellipse cx="180" cy="180" rx="120" ry="18"/>
    <ellipse cx="180" cy="180" rx="120" ry="42"/>
    <ellipse cx="180" cy="180" rx="120" ry="68"/>
    <ellipse cx="180" cy="180" rx="120" ry="92"/>
    <ellipse cx="180" cy="180" rx="120" ry="108"/>
  </g>

  <line x1="60" y1="180" x2="300" y2="180" stroke="#ff006e" stroke-width="1" opacity="0.9" filter="url(#glow)"/>
  <line x1="180" y1="60" x2="180" y2="300" stroke="#ff006e" stroke-width="0.4" opacity="0.4"/>

  <circle cx="180" cy="180" r="120" fill="none" stroke="#ff006e" stroke-width="1.4" filter="url(#glow)"/>
</svg>
